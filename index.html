<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Bloc B 1.17 — zoom (pincement / double-tap) verrouillé : comportement
         d'app native, le geste parasitait la manip en salle. maximum-scale=1 +
         user-scalable=no (respecté en PWA standalone) + touch-action côté CSS.
         Bloc I (Conv #34) — interactive-widget=resizes-content : le clavier
         virtuel réduit le viewport de mise en page (le shell `fixed inset-0`
         rétrécit au-dessus du clavier) → la recherche d'exo et ses résultats
         restent visibles au-dessus du clavier au lieu de passer dessous. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#16110f" />
    <meta name="description" content="Coach de musculation autorégulée par RPE — 100 % local, hors-ligne." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kotsh" />
    <link rel="icon" type="image/svg+xml" href="/coach-os/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/coach-os/favicon-32.png" />
    <link rel="apple-touch-icon" href="/coach-os/apple-touch-icon.png" />
    <title>Kotsh</title>
  </head>
  <!-- Conv #30 — fond du body aligné sur graphite-950 (= shell AppShell, TabBar
       et theme-color #16110f). Avant, `bg-anthracite-950` (gris froid) écrasait
       le graphite du CSS de base et apparaissait sous le shell dans la zone
       home-indicator iOS → bande « zone morte » visible sous la barre du bas.
       Tout est désormais le même graphite : plus de bande, quel que soit le
       calcul de safe-area. -->
  <body class="bg-graphite-950 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
